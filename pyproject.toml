[project]
name = "joint"
version = "0.1.0"
description = "Simple multi-modal generative models in JAX"
readme = "README.md"
authors = [
    { name = "homerjed", email = "jedhmr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "diffrax>=0.7.2",
    "einops>=0.8.2",
    "equinox>=0.13.4",
    "ipykernel>=7.2.0",
    "jax>=0.9.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "optax>=0.2.7",
    "tqdm>=4.67.3",
]

[dependency-groups]
examples = [
    "galsbi>=0.3.0,<0.4",
    "jupyterlab>=4.4,<5",
    # Retain wheels for macOS 12; newer PyTorch releases require macOS 14.
    "torch<2.9; sys_platform == 'darwin'",
]

[tool.uv.dependency-groups]
examples = {requires-python = ">=3.13,<3.14"}

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
